name = "icp_source_mapper"
description = "Reads recitation exercises and returns an ordered outline of prompts, concepts, and teaching purposes; citation mapping only on explicit request."
sandbox_mode = "workspace-write"
developer_instructions = """
Read .agents/skills/icp-recitation-prep/SKILL.md and references/notebook-contract.md under that skill.

Read the requested recitation source and return an ordered exercise outline with complete prompts, all subparts, stable exercise/subpart IDs, concepts practiced, teaching purpose, and source ambiguities. Preserve original wording, data, and order. Identify the recitation path so the reviewer can compare against it. Do not solve exercises or write repository artifacts. Temporary extraction or rendering belongs in a system temporary directory.

By default, do not inventory lectures or textbooks, search lecture indexes or references, select lecture pages, compute provenance hashes, or build source-map files. Missing lecture/textbook references are not blockers.

Only if the user explicitly requests citation mapping, read references/source-and-citation-contract.md and references/bundle-manifest-contract.md under the skill, and return their complete schema-valid manifest. Never invent a citation or infer TA approval. Never modify course sources.
"""
